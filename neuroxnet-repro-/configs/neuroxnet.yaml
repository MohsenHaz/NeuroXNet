# NeuroXNet main configuration. Every value corresponds to Table 4 of the manuscript.
experiment: neuroxnet
seed: 42
model:
  name: neuroxnet
  backbone: efficientnet_b4
  pretrained: true
  use_msam: true
  use_csag: true
  use_fpn: true
  severity_head: true
  msam_kernels: [1, 3, 5, 7]
  csag_reduction: 16
  fpn_channels: 128
  det_channels: 128
data:
  root: data/preprocessed
  split_file: data/splits/cq500_split_seed42.csv
  label_file: data/labels/cq500_severity_labels.csv
  window_level: 40
  window_width: 80
  slices: 128
  height: 256
  width: 256
  thickness_range_mm: [0.5, 5.0]
  normalisation:
    mean: 0.4723          # training-set mean after brain windowing and rescaling to [0,1]
    std: 0.2281           # training-set std; recomputed and logged by 01_preprocess.py
augmentation:
  rotation_deg: 10
  scale: [0.9, 1.1]
  translate: 0.1
  hflip_p: 0.5
  gamma: [0.8, 1.2]
  contrast: [0.9, 1.1]
  noise_sigma_max: 0.02
train:
  optimizer: adamw
  lr_max: 1.0e-4
  lr_min: 1.0e-6
  schedule: cosine
  weight_decay: 0.0        # L2 is applied through lambda_l2 in the loss, not through the optimiser
  epochs: 100
  batch_studies: 8          # 8 studies x 128 slices = 1024 slice inputs per optimisation step
  slice_chunk: 128          # slices per forward chunk (memory); logits are averaged per study before the loss
  patience: 15
  select_on: {detection: val_auroc, severity: val_macro_f1}
loss:
  type: joint               # joint | focal | class_balanced
  lambda_d: 1.0
  lambda_s: 1.5
  lambda_l2: 0.005
  lambda_orth: 0.005
  label_smoothing: 0.1
  class_weights: inverse_frequency
  focal_gamma: 2.0
  cb_beta: 0.999
eval:
  threshold: 0.5
  bootstrap_iters: 2000
